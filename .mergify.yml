conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - package-manager: uv
    directories:
      - /uvbuild
  - paths:
      - jsonescape/policy.json
    strategy: json

merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: true

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**
      - .github/workflows/**

queue_rules:
  - name: VM2 json escaped key canonicalization 1010
    queue_conditions:
      - base = vm2-jsonescape-target-1010
    merge_conditions:
      - check-success = vm2-jsonescape-never-1010
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch
    autoqueue: true
