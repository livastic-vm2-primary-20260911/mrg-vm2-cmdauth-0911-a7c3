queue_rules:
  - name: default
    merge_conditions:
      - check-success = vm2-never-pass

pull_request_rules:
  - name: VM2 strict up-to-date 0930
    conditions:
      - base = main
      - title = VM2_STRICT_ARM_0930
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm2-primary-20260911

  - name: VM2 cancelled failure race 0930
    conditions:
      - base = main
      - title = VM2_CANCEL_RACE_ARM_0930
      - check-failure = @github-actions/vm2-cancel-race-check
      - -check-cancelled = @github-actions/vm2-cancel-race-check
    actions:
      comment:
        message: VM2_CANCEL_RACE_FIRED_0930
