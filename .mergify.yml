merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**

queue_rules:
  - name: vm2 barrier scoped ci 1001
    queue_conditions:
      - base = vm2-barrier-sink-1001
      - title = VM2_BARRIER_SCOPE_ARM_1001
    merge_conditions:
      - check-success = ci-gate
    batch_size: 1
    autoqueue: true
    merge_method: merge

  - name: default
    merge_conditions:
      - check-success = vm2-never-pass

pull_request_rules:
  - name: VM2 strict up-to-date 0930
    conditions:
      - base = main
      - title = VM2_STRICT_ARM_0930
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm2-primary-20260911
