merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**
      - .github/workflows/**

queue_rules:
  - name: VM2 barrier cli protected sink 1001
    queue_conditions:
      - base = vm2-barrier-cli-target-1001
      - author = dependabot[bot]
    merge_conditions:
      - check-success = ci-gate
  - name: default
    merge_conditions:
      - check-success = vm2-never-pass

pull_request_rules:
  - name: VM2 barrier cli autoqueue 1001
    conditions:
      - base = vm2-barrier-cli-target-1001
      - author = dependabot[bot]
    actions:
      queue:
        name: VM2 barrier cli protected sink 1001
  - name: VM2 strict up-to-date 0930
    conditions:
      - base = main
      - title = VM2_STRICT_ARM_0930
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm2-primary-20260911
  - name: VM2 slug generation dependabot lowpriv 1001c
    conditions:
      - base = vm2-slug-dependabot-base-1001c
      - author = dependabot[bot]
      - check-success = @vm2-slug-moved-260930-a7q4/vm2-slug-gate
    actions:
      merge:
        method: merge
  - name: VM2 copy stale head race 1002
    conditions:
      - base = main
      - author = livastic-vm2-secondary-20260911
      - title = VM2_COPY_STALE_HEAD_1002
      - check-success = vm2-copy-race-gate-1002
    actions:
      copy:
        branches:
          - vm2-copy-race-dest-1002
        title: "VM2_COPY_RESULT_1002 {{ title }}"
        report_mode:
          - comment
