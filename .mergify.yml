
conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - paths:
      - db/schema.rb
    strategy: rails-schema

merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: true

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**
      - .github/workflows/**

queue_rules:
  - name: VM2 rails rebuild freshness 1009
    queue_conditions:
      - base = vm2-rails-rebuild-target-1009
    merge_conditions:
      - check-success = vm2-rails-rebuild-gate-1009
      - check-success = vm2-rails-never-pass-1009
    batch_size: 1
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch

  - name: VM2 npm optional precedence 1008
    queue_conditions:
      - base = vm2-pkgopt-target-1008
    merge_conditions:
      - check-success = vm2-pkgopt-hold-1008
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch

  - name: VM2 barrier cli protected sink 1001
    queue_conditions:
      - base = vm2-barrier-cli-target-1001
      - author = dependabot[bot]
    merge_conditions:
      - check-success = ci-gate
  - name: VM2 skip intermediate 1002
    queue_conditions:
      - base = vm2-skipint-target-1002
    merge_conditions:
      - check-success = vm2-skipint-gate
    batch_size: 1
    branch_protection_injection_mode: none
    merge_bot_account: livastic-vm2-primary-20260911
  - name: VM2 freeze edit ordering 1002C
    queue_conditions:
      - base = vm2-freezeedit-target-1002c
    merge_conditions:
      - check-success = vm2-freezeedit-gate
    batch_size: 1
    branch_protection_injection_mode: none
    merge_bot_account: livastic-vm2-primary-20260911
  - name: VM2 CLI103 MQ scope generation 1008
    queue_conditions:
      - base = vm2-scopegen-ro-target-1008
    merge_conditions:
      - check-success = VM2 CLI103 Scope Gate 1008
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch
    branch_protection_injection_mode: none
    merge_bot_account: livastic-vm2-primary-20260911

  - name: default
    merge_conditions:
      - check-success = vm2-never-pass

  - name: VM2 readfork CI key chain 1005
    queue_conditions:
      - base = vm2-readfork-cikey-target-1005
      - title = VM2_READFORK_CIKEY_CHAIN_1005
    merge_conditions:
      - check-success = vm2-never-pass-readfork-cikey-1005
    batch_size: 1
    branch_protection_injection_mode: none

pull_request_rules:
  - name: VM2 rails rebuild autoqueue 1009
    conditions:
      - base = vm2-rails-rebuild-target-1009
    actions:
      queue:
        name: VM2 rails rebuild freshness 1009

  - name: VM2 npm optional precedence autoqueue 1008
    conditions:
      - base = vm2-pkgopt-target-1008
    actions:
      queue:
        name: VM2 npm optional precedence 1008

  - name: VM2 CLI103 MQ scope generation autoqueue 1008
    conditions:
      - base = vm2-scopegen-ro-target-1008
    actions:
      queue:
        name: VM2 CLI103 MQ scope generation 1008

  - name: VM2 skip intermediate autoqueue 1002
    conditions:
      - base = vm2-skipint-target-1002
    actions:
      queue:
        name: VM2 skip intermediate 1002
  - name: VM2 barrier cli autoqueue 1001
    conditions:
      - base = vm2-barrier-cli-target-1001
      - author = dependabot[bot]
    actions:
      queue:
        name: VM2 barrier cli protected sink 1001
  - name: VM2 strict up-to-date 0930
    conditions:
      - base = main
      - title = VM2_STRICT_ARM_0930
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm2-primary-20260911
  - name: VM2 slug generation dependabot lowpriv 1001c
    conditions:
      - base = vm2-slug-dependabot-base-1001c
      - author = dependabot[bot]
      - check-success = @vm2-slug-moved-260930-a7q4/vm2-slug-gate
    actions:
      merge:
        method: merge

  - name: VM2 freeze edit autoqueue 1002C
    conditions:
      - base = vm2-freezeedit-target-1002c
    actions:
      queue:
        name: VM2 freeze edit ordering 1002C

  - name: VM2 request reviews stale head 1002
    conditions:
      - base = main
      - author = livastic-vm2-secondary-20260911
      - title = VM2_REQREV_RACE_1002
      - check-success = vm2-reqrev-race-gate
    actions:
      request_reviews:
        users:
          - livastic-vm2-primary-20260911

  - name: VM2 author bot self review 1003
    conditions:
      - number = 199
      - author = livastic-vm2-secondary-20260911
      - title = VM2_AUTHORBOT_SELFREVIEW_1003
    actions:
      review:
        type: APPROVE
        message: VM2_AUTHORBOT_SELFREVIEW_1003
        bot_account: "{{ author }}"
  - name: VM2 readfork CI key autoqueue 1005
    conditions:
      - base = vm2-readfork-cikey-target-1005
      - title = VM2_READFORK_CIKEY_CHAIN_1005
    actions:
      queue:
        name: VM2 readfork CI key chain 1005
priority_rules:
  - name: VM2 rails parent high 1009
    conditions:
      - title = VM2 rails rebuild C 1009
    priority: high
    allow_checks_interruption: true
