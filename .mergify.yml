merge_queue:
  mode: parallel
  max_parallel_checks: 2
queue_rules:
  - name: manual-first
    autoqueue: false
    queue_conditions:
      - title = VM2_MIGRATE_OVERLAP_1001
    merge_conditions:
      - check-success = vm2-never-pass
  - name: auto-later
    autoqueue: true
    queue_conditions:
      - title = VM2_MIGRATE_OVERLAP_1001
    merge_conditions:
      - check-success = vm2-never-pass
