conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - package-manager: uv
    directories:
      - /uvbuild

merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: true

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**
      - .github/workflows/**

queue_rules:
  - name: VM2 eslint protected crossproduct 1010
    queue_conditions:
      - base = vm2-eslint-protected-1010
    merge_conditions:
      - check-success = vm2-eslint-security-1010
    batch_size: 2
    batch_max_wait_time: 10 minutes
    merge_method: merge-batch
    autoqueue: true

pull_request_rules:
  - name: VM2 Gate1 Root92 only current controlled PR348
    conditions:
      - base = vm2-gate1-label-base-261013-w8e2
      - author = onecursor3-gif
      - title = VM2_GATE1_LABEL_TRIGGER_W8E2
      - label = vm2-gate1-owner-only-261013-w8e2
    actions:
      label:
        add:
          - vm2-gate1-bot-canary-261013-w8e2
