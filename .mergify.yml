conflict_resolvers:
  - package-manager: npm
    directories:
      - /pkg
  - package-manager: uv
    directories:
      - /uvbuild

merge_queue:
  mode: parallel
  max_parallel_checks: 2
  skip_intermediate_results: true

scopes:
  source:
    files:
      frontend:
        include:
          - frontend/**
  barrier_files:
    include:
      - global/**
      - .github/workflows/**
