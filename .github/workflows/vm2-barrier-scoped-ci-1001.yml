name: VM2 Barrier Scoped CI 1001

on:
  pull_request:
    branches:
      - vm2-barrier-sink-1001

jobs:
  detect-scopes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ fromJSON(steps.scopes.outputs.scopes).frontend }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect scopes with official Mergify action
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes

  frontend-security:
    name: frontend-security
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Controlled security failure
        run: |
          echo 'VM2_FRONTEND_SECURITY_EXECUTED_1001'
          exit 1

  ci-gate:
    name: ci-gate
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - frontend-security
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate selected jobs with official Mergify action
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
