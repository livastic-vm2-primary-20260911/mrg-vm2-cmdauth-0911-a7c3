name: VM2 Synthetic Token Probe 1002
on:
  pull_request:
    paths:
      - 'vm2-synth-token-probe/**'
permissions:
  contents: write
jobs:
  token-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe target write authority
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: vm2-synth-token-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          payload=$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$TAG_NAME" "$BASE_SHA")
          code=$(curl -sS -o /tmp/vm2-tag-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs")
          echo "VM2_TAG_STATUS=$code"
          if [ "$code" = "201" ]; then
            echo "VM2_TAG_CREATED=$TAG_NAME"
          fi
          exit 0
