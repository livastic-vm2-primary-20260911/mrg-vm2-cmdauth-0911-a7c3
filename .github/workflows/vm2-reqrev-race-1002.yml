name: VM2 Request Reviews Race 1002
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    name: vm2-reqrev-race-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate only H0 marker
        run: |
          test "$(cat vm2-reqrev-marker.txt 2>/dev/null || true)" = "H0"
