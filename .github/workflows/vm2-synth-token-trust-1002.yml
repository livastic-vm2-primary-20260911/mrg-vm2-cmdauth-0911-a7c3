name: VM2 MQ Synthetic Token Trust 1002

on:
  pull_request:
    paths:
      - "vm2-synth-token-probe/**"

permissions:
  contents: write

jobs:
  token-probe:
    name: vm2-synth-token-probe
    runs-on: ubuntu-latest
    steps:
      - name: Attempt controlled target tag write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          tag="vm2-synth-token-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          body=$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$tag" "$BASE_SHA")
          code=$(curl -sS -o /tmp/vm2-tag-response -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/git/refs"             -d "$body")
          echo "VM2_HEAD_REPO=$PR_HEAD_REPO"
          echo "VM2_TOKEN_PROBE_HTTP=$code"
          if [ "$code" = "201" ]; then
            echo "VM2_TOKEN_WRITE=1"
          else
            echo "VM2_TOKEN_WRITE=0"
          fi
          exit 0
