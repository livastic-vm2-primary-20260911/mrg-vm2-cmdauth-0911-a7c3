name: VM2 AutoRetry Branch Provenance 0930

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  write_side_effect:
    name: vm2-branchprov-write-side-effect
    runs-on: ubuntu-latest
    steps:
      - name: Write controlled canary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" -f body="VM2_BRANCH_PROV_SIDE_EFFECT attempt=$ATTEMPT run=$RUN_ID"

  trigger:
    name: vm2-branchprov-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Fail first attempt only
        env:
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "VM2_BRANCH_PROV_ATTEMPT=$ATTEMPT"
          echo "VM2_BRANCH_PROV_HEAD_REPO=$HEAD_REPO"
          echo "VM2_BRANCH_PROV_HEAD_REF=$HEAD_REF"
          if [ "$ATTEMPT" = "1" ]; then
            echo "VM2_BRANCH_PROV_CONTROLLED_FAILURE"
            exit 1
          fi
          echo "VM2_BRANCH_PROV_RETRY_SUCCESS"
